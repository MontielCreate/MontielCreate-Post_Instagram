<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feed Instagram</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container-fluid">

    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container">
        <a class="navbar-brand" href="https://www.instagram.com" target="_blank">
          <i class="fa-brands fa-instagram" style="font-size:25px;"></i>
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4jKAVNgwwCGBxuMlIQEeiCrNIZm2JA-D_-g&s"
               alt="Logo" width="100" height="35" class="d-inline-block align-text-top">
        </a>
        <div class="d-flex ms-auto gap-2">
          <button id="btn-list" class="btn btn-secondary text-muted border-0">
            <i class="fa-solid fa-"></i>
          </button>
          <button id="btn-grid" class="btn btn-secondary text-muted border-0">
            <i class="fa-solid fa-"></i>
          </button>
        </div>
        <button class="btn btn-success ms-3">Create a Post</button>
        <li class="nav-item dropdown list-unstyled ms-3">
          <a class="nav-link dropdown-toggle text-gray" href="#" data-bs-toggle="dropdown">
            <i class="fas fa-cog"></i>
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Perfil</a></li>
            <li><a class="dropdown-item" href="#">Accesibilidad</a></li>
            <li><a class="dropdown-item" href="#">Privacidad</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#">Salir</a></li>
          </ul>
        </li>
      </div>
    </nav>

    <div id="feed" class="row row-cols-1 row-cols-md-3 g-3 justify-content-center">
      
      <div class="col">
        <div class="card">
          <img src="https://acnews.blob.core.windows.net/imgnews/medium/NAZ_7b7be715764f4381b9ee2cf228461f0c.webp"
               class="card-img-top" style="height:270px;object-fit:cover;" alt="Pop 2025">
          <div class="card-body p-2"><i class="fa-brands fa-gratipay"></i><i class="fa-brands fa-facebook-messenger"></i><div><strong>Chevy Pop 2025</strong></div></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <img src="https://www.pgp.com.mx/cdn/shop/articles/2020_CHEVROLET_CAMARO_SS_COUPE_2SS01.jpg?v=1707851742"
               class="card-img-top" style="height:270px;object-fit:cover;" alt="Tsuru 2030">
          <div class="card-body p-2"><i class="fa-brands fa-gratipay"></i><i class="fa-brands fa-facebook-messenger"></i><div><strong> Tsuru 2030</strong></div></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <img src="https://s3-us-west-2.amazonaws.com/my-car-mexico/modelos/e31699df/Dodge-Challenger-2022-1.webp"
               class="card-img-top" style="height:270px;object-fit:cover;" alt="Bocho 2023">
          <div class="card-body p-2"><i class="fa-brands fa-gratipay"></i><i class="fa-brands fa-facebook-messenger"></i><div><strong> Bocho 2023</strong></div></div>
        </div>
      </div>
      
      
      
<div class="col extra">
  <div class="card">
    <img
      src="https://img.remediosdigitales.com/276ee8/db2019al01148_large/450_1000.jpg"
      class="card-img-top"
      style="height:270px;object-fit:cover;"
      alt="Random A">
    <div class="card-body p-2">
      <i class="fa-brands fa-gratipay"></i>
      <i class="fa-brands fa-facebook-messenger"></i>
      <div><strong>camion 98</strong></div>
    </div>
  </div>
</div>

<div class="col extra">
  <div class="card">
    <img
      src="https://www.purosautos.com/wp-content/uploads/2016/11/huayra.jpg"
      class="card-img-top"
      style="height:270px;object-fit:cover;"
      alt="Random B">
    <div class="card-body p-2">
      <i class="fa-brands fa-gratipay"></i>
      <i class="fa-brands fa-facebook-messenger"></i>
    <div>  <strong>versa 2027</strong></div>
    </div>
  </div>
</div>

<div class="col extra">
  <div class="card">
    <img
      src="https://s1.ppllstatics.com/hoy/www/multimedia/201603/11/media/Cupra_17.jpg"
      class="card-img-top"
      style="height:270px;object-fit:cover;"
      alt="Random C">
    <div class="card-body p-2">
      <i class="fa-brands fa-gratipay"></i>
      <i class="fa-brands fa-facebook-messenger"></i>
    <div>  <strong>taxi 32</strong></div>
    </div>
  </div>
</div>

      </div>
    </div>
 

  </div>
  <script>
    const feed    = document.getElementById('feed');
    const btnGrid = document.getElementById('btn-grid');
    const btnList = document.getElementById('btn-list');
    const extras  = document.querySelectorAll('.extra');

    btnList.addEventListener('click', () => {
      feed.classList.replace('row-cols-md-3','row-cols-1');
      extras.forEach(e => e.classList.remove('d-none'));
    });

    btnGrid.addEventListener('click', () => {
      feed.classList.replace('row-cols-1','row-cols-md-3');
      extras.forEach(e => e.classList.add('d-none'));
    });
  </script>

</body>
</html>
